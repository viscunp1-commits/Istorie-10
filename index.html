<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Temele la istorie clasa a X-a explicate pe scurt - History Scope</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bg"></div>
<div id="app">
 <nav id="side" aria-label="Temele">
  <div class="brand-logo" id="hm" title="Mergi la pagina principală">
    <img src="logo1.jpg" alt="History Scope Logo" id="sidebar-logo-img">
    <span>History Scope</span>
  </div>
  <input id="q" type="search" placeholder="Caută o temă…" aria-label="Caută o temă">
  <div id="list"></div>
 </nav>
 <main id="main"><div class="wrap">
  <button id="menu" aria-label="Deschide lista de teme">☰ Teme</button>
  <div id="view"></div>
 </div></main>
</div>

<div id="logo-modal" class="logo-modal">
  <div class="modal-content">
    <img src="logo1.jpg" alt="History Scope Logo Mare">
    <div class="modal-text">Apasă din nou pe logo pentru a reveni la pagina principală</div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
